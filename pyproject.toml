[project]
name = "datanar-django"
version = "2.5.4"
description = "сервис по сокращению ссылок на базе Django и Bootstrap"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "antispam-link-shorteners==0.2.1",
    "celery==5.6.3",
    "django==4.2.30",
    "django-allauth==65.14.3",
    "django-cleanup==9.0.0",
    "django-settings-export==1.2.1",
    "django-tz-detect==0.5.0",
    "django-user-agents==0.4.0",
    "djangorestframework==3.16.1",
    "geoip2==5.1.0",
    "gunicorn==23.0.0",
    "openpyxl==3.1.5",
    "pillow==11.3.0",
    "psycopg2-binary==2.9.12",
    "python-decouple==3.8",
    "redis==6.4.0",
    "segno==1.6.6",
    "sorl-thumbnail==12.11.0",
    "sqids==0.5.2",
]

[dependency-groups]
dev = [
    "celery-types>=0.23.0",
]
test = [
    "django-debug-toolbar==6.1.0",
    "parameterized==0.9.0",
]

[tool.ruff]
line-length = 79
extend-exclude = ["migrations", "manage.py"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = [
    "A",
    "C4",
    "COM",
    "DJ",
    "E",
    "EM",
    "ERA",
    "F",
    "FIX",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PLE",
    "PLW",
    "PTH",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "T20",
    "TID",
    "UP",
    "W",
]
ignore = [
    "RUF001",
    "RUF003",
    "RUF012",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = false
known-first-party = [
    "api",
    "dashboard",
    "core",
    "datanar",
    "homepage",
    "qr_codes",
    "redirects",
    "statistic",
    "users",
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
