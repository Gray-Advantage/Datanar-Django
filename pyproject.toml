[tool.flake8]
max-line-length = 79
inline-quotes = "double"
import-order-style = "google"
extend-exclude = ["*/migrations"]
application-import-names = [
    "api",
    "dashboard",
    "core",
    "datanar",
    "homepage",
    "qr_codes",
    "redirects",
    "statistic",
    "users",
]

[tool.ruff]
line-length = 79
target-version = "py39"
extend-exclude = ["migrations"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = [
    "A",
    "COM",
    "DJ",
    "E",
    "ERA",
    "F",
    "FIX",
    "I",
    "ISC",
    "N",
    "PTH",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "T20",
    "TID",
    "UP",
    "W",
]
ignore = [
    "RUF001",
    "RUF003",
    "RUF012",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = false
known-first-party = [
    "api",
    "dashboard",
    "core",
    "datanar",
    "homepage",
    "qr_codes",
    "redirects",
    "statistic",
    "users",
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
