name: Datanar

on:
  push:
    branches: [ "main", "dev", "artem", "sergey", "vladimir", "for_merge"]
  pull_request:
    branches: [ "main", "dev", "artem", "sergey", "vladimir", "for_merge"]

permissions:
  contents: read

jobs:
  black-test:
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: pip install black
      - name: Check code formatting with black
        run: black ./datanar/ --check --verbose --diff

  flake8-test:
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: pip install -r requirements/test.txt
    - name: Check code formatting with flake8
      run: flake8 ./datanar/

  ruff-check:
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@v3
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check --show-fixes ./datanar

  ruff-format:
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@v3
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff format check
        run: ruff format --check --diff ./datanar

  django-py312-test:
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Run Django tests
        run: |
          cd ./datanar
          python manage.py test

  django-py39-test:
    runs-on: ubuntu-latest
    container: python:3.9-alpine
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Run Django tests
        run: |
          cd ./datanar
          python manage.py test

  prod-deploy:
    if: github.ref == 'refs/heads/main'
    needs: [black-test, flake8-test, ruff-check, ruff-format, django-py312-test, django-py39-test]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd ~/datanar
          docker compose down
          git reset --hard origin/main  
          git pull origin main
          docker compose up --build -d
          docker system prune -a -f --volumes